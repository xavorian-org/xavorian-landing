<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Standard Land Sizes Across Nigerian States Compared — Generated editorial illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="24" y="24" width="1152" height="582" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  
  <!-- Top Bar -->
  <rect x="56" y="54" width="420" height="32" rx="16" fill="#059669" fill-opacity="0.1"/>
  <text x="74" y="75" font-family="Plus Jakarta Sans, Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#059669" letter-spacing="1.2">EDITORIAL ILLUSTRATION • NIGERIAN LAND MEASUREMENTS</text>
  
  <rect x="830" y="54" width="314" height="32" rx="16" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="987" y="75" text-anchor="middle" font-family="Plus Jakarta Sans, Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#92400e">ILLUSTRATION — NOT A REAL PROPERTY PHOTO</text>

  <!-- Title & Subtitle -->
  <text x="56" y="132" font-family="Plus Jakarta Sans, Inter, system-ui, sans-serif" font-size="30" font-weight="800" fill="#0f172a">Standard Land Sizes Across Nigerian States Compared</text>
  <text x="56" y="166" font-family="Plus Jakarta Sans, Inter, system-ui, sans-serif" font-size="17" font-weight="500" fill="#475569">Always verify exact square metres (SQM) on the Registered Survey Plan</text>

  <!-- 4 Cards Grid (2x2) -->
  
    <g filter="url(#cardShadow)">
      <rect x="56" y="204" width="536" height="148" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <rect x="76" y="224" width="86" height="28" rx="8" fill="#059669"/>
      <text x="119" y="243" text-anchor="middle" font-family="Plus Jakarta Sans, Inter, system-ui, sans-serif" font-size="12" font-weight="800" fill="#ffffff">300 SQM</text>
      <text x="176" y="245" font-family="Plus Jakarta Sans, Inter, system-ui, sans-serif" font-size="20" font-weight="800" fill="#0f172a">Half Plot (Estate Standard)</text>
      <text x="78" y="288" font-family="Plus Jakarta Sans, Inter, system-ui, sans-serif" font-size="15" font-weight="500" fill="#334155">Common in Lekki, Ajah and compact estates; fits a or</text>
      <text x="78" y="314" font-family="Plus Jakarta Sans, Inter, system-ui, sans-serif" font-size="15" font-weight="500" fill="#334155">terrace compact duplex</text>
    </g>

    <g filter="url(#cardShadow)">
      <rect x="608" y="204" width="536" height="148" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <rect x="628" y="224" width="86" height="28" rx="8" fill="#059669"/>
      <text x="671" y="243" text-anchor="middle" font-family="Plus Jakarta Sans, Inter, system-ui, sans-serif" font-size="12" font-weight="800" fill="#ffffff">500–648 SQM</text>
      <text x="728" y="245" font-family="Plus Jakarta Sans, Inter, system-ui, sans-serif" font-size="20" font-weight="800" fill="#0f172a">Standard Lagos / Ogun Plot</text>
      <text x="630" y="288" font-family="Plus Jakarta Sans, Inter, system-ui, sans-serif" font-size="15" font-weight="500" fill="#334155">500sqm in modern estates; 60ft x 120ft (648sqm) in</text>
      <text x="630" y="314" font-family="Plus Jakarta Sans, Inter, system-ui, sans-serif" font-size="15" font-weight="500" fill="#334155">older mainland layouts</text>
    </g>

    <g filter="url(#cardShadow)">
      <rect x="56" y="374" width="536" height="148" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <rect x="76" y="394" width="86" height="28" rx="8" fill="#059669"/>
      <text x="119" y="413" text-anchor="middle" font-family="Plus Jakarta Sans, Inter, system-ui, sans-serif" font-size="12" font-weight="800" fill="#ffffff">900+ SQM</text>
      <text x="176" y="415" font-family="Plus Jakarta Sans, Inter, system-ui, sans-serif" font-size="20" font-weight="800" fill="#0f172a">100ft x 100ft (Benin / Asaba)</text>
      <text x="78" y="458" font-family="Plus Jakarta Sans, Inter, system-ui, sans-serif" font-size="15" font-weight="500" fill="#334155">Common plot dimension in Edo and Delta; nearly double</text>
      <text x="78" y="484" font-family="Plus Jakarta Sans, Inter, system-ui, sans-serif" font-size="15" font-weight="500" fill="#334155">a 500sqm estate plot</text>
    </g>

    <g filter="url(#cardShadow)">
      <rect x="608" y="374" width="536" height="148" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <rect x="628" y="394" width="86" height="28" rx="8" fill="#059669"/>
      <text x="671" y="413" text-anchor="middle" font-family="Plus Jakarta Sans, Inter, system-ui, sans-serif" font-size="12" font-weight="800" fill="#ffffff">4,046 / 10k SQM</text>
      <text x="728" y="415" font-family="Plus Jakarta Sans, Inter, system-ui, sans-serif" font-size="20" font-weight="800" fill="#0f172a">1 Acre (6 Plots) vs 1 Hectare</text>
      <text x="630" y="458" font-family="Plus Jakarta Sans, Inter, system-ui, sans-serif" font-size="15" font-weight="500" fill="#334155">1 Acre is ~4,046sqm (6 standard plots); 1 Hectare is</text>
      <text x="630" y="484" font-family="Plus Jakarta Sans, Inter, system-ui, sans-serif" font-size="15" font-weight="500" fill="#334155">10,000sqm (~15–20 plots)</text>
    </g>

  <!-- Footer -->
  <line x1="56" y1="556" x2="1144" y2="556" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="56" y="584" font-family="Plus Jakarta Sans, Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Xavorian Property Desk • www.xavorian.com</text>
  <text x="1144" y="584" text-anchor="end" font-family="Plus Jakarta Sans, Inter, system-ui, sans-serif" font-size="12" font-weight="500" fill="#64748b">Generated educational diagram — never presented as a photograph of a real property</text>
</svg>